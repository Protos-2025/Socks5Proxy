name: Continuous Benchmarking
on:
  push:
    branches:
      - main

jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Run benchmark
        run: docker compose up --build --abort-on-container-exit benchmark
      
      - name: Format benchmark output
        run: |
          stats=bench/results/jmeter-html-report/statistics.json
          outfile=output.txt
          mean=$(jq '."Total".meanResTime' "$stats")
          p99=$(jq '."Total".pct3ResTime' "$stats")
          min=$(jq '."Total".minResTime' "$stats")
          max=$(jq '."Total".maxResTime' "$stats")
          median=$(jq '."Total".medianResTime' "$stats")
          samples=$(jq '."Total".sampleCount' "$stats")
          throughput=$(jq '."Total".throughput' "$stats")
          extra=$(printf 'Samples: %s\nMedian: %s\nThroughput: %s rpm\n' "$samples" "$median" "$throughput")
          jq -n --arg name1 "JMeter Mean Response Time" --arg unit1 "Milliseconds" --argjson value1 "$mean" \
            --arg name2 "JMeter P99 Response Time" --arg unit2 "Milliseconds" --argjson value2 "$p99" \
            --arg range "$min - $max ms" --arg extra "$extra" \
            '[ { name: $name1, unit: $unit1, value: $value1 }, { name: $name2, unit: $unit2, value: $value2, range: $range, extra: $extra } ]' > "$outfile"
        
      # Download previous benchmark result from cache (if exists)
      - name: Download previous benchmark data
        uses: actions/cache@v4
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: 'customSmallerIsBetter'
          # Where the output from the benchmark tool is stored
          output-file-path: output.txt
          # Where the previous data file is stored
          external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
      # Upload the updated cache file for the next job by actions/cache
# NOTE: ***THIS ACTION IS EXPENSIVE TO RUN***
# It should only have workflow_dispatch and workflow_call triggers to avoid running on every push/pr.

name: Matrix benchmarking
on:
  workflow_dispatch:
    inputs:
      selector_capacities:
        description: "Selector capacities"
        default: '[1024]'
      buffer_sizes:
        description: "Buffer sizes"
        default: '[1024]'
      max_pending_connections:
        description: "Max pending connections"
        default: '[20]'

permissions: write-all

jobs:
  benchmark:
    name: Bench
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        selector_capacity: ${{ fromJson( github.event.inputs.selector_capacities || '[1024]' ) }}
        buffer_size: ${{ fromJson( github.event.inputs.buffer_sizes || '[1024]' ) }}
        max_pending_connections: ${{ fromJson( github.event.inputs.max_pending_connections || '[20]' ) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Pre-build benchmark image with cached layers (Blacksmith)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.benchmark
          push: false
          load: true
          tags: ghcr.io/protos-2025/socks5proxy/benchmark:latest
          # Blacksmith manages caching; no external cache-from/cache-to needed

      - name: Run benchmark - (buffer=${{ matrix.buffer_size }}, selector=${{ matrix.selector_capacity }}, pending=${{ matrix.max_pending_connections }})
        run: |
          echo "DEBUG=false" > .env
          echo "TRACE=false" >> .env
          echo "LOGGER_MIN_LEVEL=LOGGER_FATAL" >> .env
          echo "MAX_LOG_QUEUE_SIZE=10000" >> .env
          echo "MOCK_ETC_HOST=./bench/data/mock-etc-host" >> .env
          echo "BUFFER_SIZE=${{ matrix.buffer_size }}" >> .env
          echo "SELECTOR_CAPACITY=${{ matrix.selector_capacity }}" >> .env
          echo "MAX_PENDING_CONNECTIONS=${{ matrix.max_pending_connections }}" >> .env
          docker compose build benchmark
          docker compose up --abort-on-container-exit benchmark
      
      - name: Format benchmark output
        run: |
          stats=bench/results/jmeter-html-report/statistics.json
          outfile=output-${{ github.run_id }}-${{ matrix.buffer_size }}-${{ matrix.selector_capacity }}-${{ matrix.max_pending_connections }}.txt
          mean=$(jq '."Total".meanResTime' "$stats")
          p99=$(jq '."Total".pct3ResTime' "$stats")
          min=$(jq '."Total".minResTime' "$stats")
          max=$(jq '."Total".maxResTime' "$stats")
          errorPct=$(jq '."Total".errorPct' "$stats")
          median=$(jq '."Total".medianResTime' "$stats")
          samples=$(jq '."Total".sampleCount' "$stats")
          throughput=$(jq '."Total".throughput' "$stats")
          extra=$(printf 'Config: %s\nBuffer: %s\nSelector: %s\nPending: %s\nSamples: %s\nMedian: %s\nThroughput: %s rpm\n' \
            "b=${{ matrix.buffer_size }}, s=${{matrix.selector_capacity}}, p=${{ matrix.max_pending_connections }}" "${{ matrix.buffer_size }}" "${{ matrix.selector_capacity }}" \
            "${{ matrix.max_pending_connections }}" "$samples" "$median" "$throughput")
          jq -n --arg name1 "JMeter Mean Response Time" --arg unit1 "Milliseconds" --argjson value1 "$mean" \
            --arg name2 "JMeter P99 Response Time" --arg unit2 "Milliseconds" --argjson value2 "$p99" \
            --arg name3 "Error Percentage" --arg unit3 "Percent" --argjson value3 "$errorPct" \
            --arg range "$min - $max ms" --arg extra "$extra" \
            '[ { name: $name1, unit: $unit1, value: $value1 }, { name: $name2, unit: $unit2, value: $value2, range: $range, extra: $extra }, { name: $name3, unit: $unit3, value: $value3 } ]' > "$outfile"
          echo "p99=$p99" >> $GITHUB_OUTPUT
          echo "errorPct=$errorPct" >> $GITHUB_OUTPUT
          echo "mean=$mean" >> $GITHUB_OUTPUT
          echo "throughput=$throughput" >> $GITHUB_OUTPUT
          echo "buffer=${{ matrix.buffer_size }}" >> $GITHUB_OUTPUT
          echo "selector=${{ matrix.selector_capacity }}" >> $GITHUB_OUTPUT
          echo "pending=${{ matrix.max_pending_connections }}" >> $GITHUB_OUTPUT
        id: metrics

      - name: Save results to file
        run: |
          mkdir -p /tmp/bench-results
          echo "${{ steps.metrics.outputs.p99 }}|${{ matrix.buffer_size }}|${{ steps.metrics.outputs.buffer }}|${{ steps.metrics.outputs.selector }}|${{ steps.metrics.outputs.pending }}|${{ steps.metrics.outputs.errorPct }}|${{ steps.metrics.outputs.mean }}|${{ steps.metrics.outputs.throughput }}" > /tmp/bench-results/${{ github.run_id }}-${{ matrix.buffer_size }}-${{ matrix.selector_capacity }}-${{ matrix.max_pending_connections }}.txt

      - name: Upload result for ranking
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}-${{ matrix.buffer_size }}-${{ matrix.selector_capacity }}-${{ matrix.max_pending_connections }}
          overwrite: true
          path: /tmp/bench-results/${{ github.run_id }}-${{ matrix.buffer_size }}-${{ matrix.selector_capacity }}-${{ matrix.max_pending_connections }}.txt
          retention-days: 1

  rank-results:
    name: Rank configurations by P99
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: benchmark
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Rank by P99 and create summary
        run: |
          echo "# Benchmark Results Ranking (by P99)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Rank | Configuration | Buffer Size | Selector Capacity | Max Pending | P99 (ms) | Error Percentage | Mean (ms) | Throughput (rpm) |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------------|-------------|-------------------|-------------|----------|------------------|-----------|------------------|" >> $GITHUB_STEP_SUMMARY
          
          # Collect and sort results
          rank=1
          for file in results/*.txt; do
            if [ -f "$file" ]; then
              cat "$file"
            fi
          done | sort -t'|' -k1 -n | while IFS='|' read -r p99 config buffer selector pending errorPct mean throughput; do
            echo "| $rank | $config | $buffer | $selector | $pending | $p99 | $errorPct | $mean | $throughput |" >> $GITHUB_STEP_SUMMARY
            rank=$((rank + 1))
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Lower P99 values indicate better performance**" >> $GITHUB_STEP_SUMMARY

